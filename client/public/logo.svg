<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Bookora">
  <defs>
    <linearGradient id="bg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A7A80"/>
      <stop offset="1" stop-color="#155E63"/>
    </linearGradient>
    <linearGradient id="gold" x1="34" y1="18" x2="52" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E0C48A"/>
      <stop offset="1" stop-color="#C6A76A"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F3F42" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- Rounded square mark -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bg)" filter="url(#soft)"/>
  <!-- Calendar body -->
  <rect x="16" y="20" width="32" height="28" rx="5" fill="#F7FBFC"/>
  <!-- Calendar top bar -->
  <path d="M16 25.5c0-3 2.5-5.5 5.5-5.5h21c3 0 5.5 2.5 5.5 5.5V28H16v-2.5z" fill="url(#gold)"/>
  <!-- Binding rings -->
  <rect x="24" y="16" width="3.2" height="8" rx="1.6" fill="#F7FBFC"/>
  <rect x="36.8" y="16" width="3.2" height="8" rx="1.6" fill="#F7FBFC"/>
  <!-- Check / booked mark -->
  <path d="M24.5 38.5l4.2 4.2 10.5-11" stroke="#155E63" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Soft highlight for 3D feel -->
  <path d="M12 14c6-6 18-8 28-4" stroke="#fff" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round"/>
</svg>
